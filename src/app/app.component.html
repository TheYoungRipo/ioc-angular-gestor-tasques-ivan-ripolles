<main class="main-container">
  <h1>{{ appName }}</h1>

  <section class="card">
    <h2>Filtres de cerca</h2>
    <app-task-filter></app-task-filter>
  </section>

  <section class="card">
    <h2>Llistat de Tasques ({{ tasks.length }})</h2>
    <app-task-list [tasks]="tasks" (selectTask)="handleTaskSelected($event)"></app-task-list>
  </section>

  @if (selectedTask) {
    <aside class="note">
      <h2>Detall de la tasca seleccionada</h2>
      <p><strong>Títol:</strong> {{ selectedTask.titol }}</p>
      <p><strong>Descripció:</strong> {{ selectedTask.descripcio }}</p>
      <p><strong>Categoria:</strong> {{ selectedTask.categoria }}</p>
    </aside>
  }
</main>
